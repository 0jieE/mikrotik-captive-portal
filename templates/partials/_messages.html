{% if messages %}
<div class="messages">
  {% for m in messages %}
  <div class="alert alert-{{ m.tags|default:'info' }} alert-dismissible fade show" role="alert">
    {{ m }}
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>
  {% endfor %}
</div>
{% endif %}
