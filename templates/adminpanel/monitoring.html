{% extends 'base_admin.html' %}
{% block title %}Live monitoring{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 page-title mb-0">Live monitoring</h1>
  <span class="small text-muted">Refreshes every 5 seconds</span>
</div>
<div id="live" hx-get="{% url 'adminpanel:monitoring_live' %}" hx-trigger="load, every 5s" hx-swap="innerHTML">
  <div class="text-muted">Loading...</div>
</div>
{% endblock %}
